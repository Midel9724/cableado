<!DOCTYPE html>
<html lang="es">
<head>
  <title>Cable Happy </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1 id="company-name">Cargando...</h1>
        <h3 id="company-slogan"></h3>
        <p id="company-desc"></p>
    </header>

    <section>
        <h2>Nuestras Soluciones</h2>
        <p>Elige un servicio para enviarnos una solicitud de cotización automáticamente.</p>

        <div id="servicios-container"></div>
    </section>

    <section class="contacto-section">
        <h2>Contáctanos</h2>

        <div class="info-contacto">
            <p>
                <i class="fas fa-phone"></i>
                <span id="contact-tel"></span>
            </p>
            <p>
                <i class="fas fa-envelope"></i>
                <span id="contact-email"></span>
            </p>
            <p>
                <i class="fas fa-map-marker-alt"></i>
                <span id="contact-dir"></span>
            </p>
        </div>

        <a id="btn-contacto-general" href="#">Consulta General por Correo</a>
    </section>

    <footer>
        <p>&copy; Cable Happy - Soluciones de Conectividad</p>
    </footer>

    <script src="logica.js"></script>

</body>
</html>
